<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Books</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
    />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"
      integrity="sha512-ykZ1QQr0Jy/4ZkvKuqWn4iF3lqPZyij9iRv6sGqLRdTPkY69YX6+7wvVGmsdBbiIfN/8OdsI7HABjvEok6ZopQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <link rel="stylesheet" href="./src/css/myBooks.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container-fluid" id="header">
      <div class="row">
        <h1>Book Library</h1>
        <nav>
          <a href="./index.html" class="btn">Home</a>
          <a href="./myBooks.html" class="btn">My Books</a>
          <a href="" class="btn" id="continue-reading">Continue Reading</a>
          <a href="" class="btn" id="set-goals">Set Reading Goal</a>
          <div id="set-reading-goal-modal">
            <button
              type="button"
              class="btn-close close close-reading-goal-modal"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
            <div style="display: flex; justify-content: center">
              <div class="reading-goal-modal-header">
                <h5 class="modal-title">Set Reading Goal</h5>
              </div>
            </div>
            <div class="modal-body">
              <div class="ui-input-container">
                <input
                  required=""
                  placeholder="Pages..."
                  class="ui-input"
                  type="number"
                  id="reading-goal"
                />
              </div>
              <div>
                <div class="select-time-period">
                  <input
                    type="radio"
                    id="daily"
                    name="time-period"
                    value="daily"
                  />
                  <label for="daily">Daily</label>
                  <input
                    type="radio"
                    id="weekly"
                    name="time-period"
                    value="weekly"
                  />
                  <label for="weekly">Weekly</label>
                  <input
                    type="radio"
                    id="monthly"
                    name="time-period"
                    value="monthly"
                  />
                  <label for="monthly">Monthly</label>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn save-reading-goal">
                    Save
                  </button>
                  <button type="button" class="btn remove-reading-goal">
                    Remove Goal
                </button>
                </div>
              </div>
            </div>
          </div>
        </nav>
      </div>
    </div>
    <div class="container" id="main-container">
      <div class="container" id="sidebar">
        <button href="" class="btn filter all active">All Books</button>
        <button href="" class="btn filter read">Read</button>
        <button href="" class="btn filter currently-reading">Currently Reading</button>
        <button href="" class="btn filter want-to-read">Want To Read</button>
        <button href="" class="btn favourites">Favourites</button>
      </div>
      <div class="container-fluid" id="my-books">
        <h2>My Books</h2>
        <div class="container-fluid" id="my-books-list">
          <div class="bookshelf"></div>
        </div>
      </div>
    </div>
    <div id="book-modal">
      <div id="book-data-modal">
        <div class="id" style="display: none"></div>
        <button
          type="button"
          class="btn-close close-book-data-modal close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
        <div style="display: flex; justify-content: center">
          <div class="book-data-modal-header">
            <h5 class="modal-title"></h5>
          </div>
        </div>
        <div class="modal-body">
          <div class="left">
            <img src="" alt="" class="modal-book-image" />
            <div class="progress">
              <div
                class="progress-bar"
                role="progressbar"
                aria-valuenow="0"
                aria-valuemin="0"
                aria-valuemax="100"
              ></div>
            </div>
            <div class="update-progress">
              <i class="fa-solid fa-plus" style="font-size: larger; cursor: pointer"></i>
            </div>
            <div style="display: flex; justify-content: space-between;">
              <div class="show-progress"></div>
              <div class="">
                <i class="fa-regular fa-heart toggle-favourite" style="font-size: 50px;; cursor: pointer; color: red"></i>
              </div>
            </div>
          </div>
          <div class="right">
            <div>
              <h6>Author:</h6>
              <div class="author"></div>
            </div>
            <div>
              <h6>Category:</h6>
              <div class="category"></div>
            </div>
            <div>
              <h6>Description:</h6>
              <div class="description"></div>
            </div>
            <div>
              <h6>Publisher:</h6>
              <div class="publisher"></div>
            </div>
            <div>
              <h6>Published Date:</h6>
              <div class="publishedDate"></div>
            </div>
          </div>
        </div>
        <div class="modal-footer" style="justify-content: center;">
          <button class="button remove-book">
            <svg viewBox="0 0 448 512" class="svgIcon">
              <path
                d="M135.2 17.7L128 32H32C14.3 32 0 46.3 0 64S14.3 96 32 96H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H320l-7.2-14.3C307.4 6.8 296.3 0 284.2 0H163.8c-12.1 0-23.2 6.8-28.6 17.7zM416 128H32L53.2 467c1.6 25.3 22.6 45 47.9 45H346.9c25.3 0 46.3-19.7 47.9-45L416 128z"
              ></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
    <div id="error-popup">
      <div class="popup-inner">
        <div class="error-message"></div>
      </div>
      <div id="error-timer"></div>
    </div>
  </body>
  <script src="./src/js/myBooks.js"></script>
</html>
