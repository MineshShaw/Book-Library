<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Books</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js" integrity="sha512-ykZ1QQr0Jy/4ZkvKuqWn4iF3lqPZyij9iRv6sGqLRdTPkY69YX6+7wvVGmsdBbiIfN/8OdsI7HABjvEok6ZopQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./src/css/myBooks.css">
</head>
<body>
    <div class="container" id="header">
        <div class="row">
            <h1>Book Library</h1>
            <nav>
                <a href="./index.html" class="btn">Home</a>
                <a href="./myBooks.html" class="btn">My Books</a>
                <a href="./browse.html" class="btn">Browse</a>
            </nav>
        </div>
    </div>
    <div class="container" id="main-container">
        <div class="container" id="sidebar">
            <a href="" class="btn">Read</a>
            <a href="" class="btn">Currently Reading</a>
            <a href="" class="btn">Want To Read</a>
            <a href="" class="btn">Favourites</a>
        </div>
        <div class="container" id="my-books">
            <h2>My Books</h2>
            <div class="container-fluid" id="my-books-list">
               <div class="bookshelf">
                <div class="shelf">
                    <div class="book">
                        <img src="https://books.google.com/books/content?id=PrEkEQAAQBAJ&printsec=frontcover&img=1&zoom=1&edge=curl&source=gbs_api" class="book-image" alt="">
                    </div>
                </div>
               </div>
            </div>
        </div>
    </div>
    <div class="modal" id="book-data-modal">
        <h5 class="modal-title">
            Atlas and the traitor
        </h5>
        <div class="left">
            <img src="" alt="">
            <div class="progress-bar"></div>
        </div>
        <div class="right">
            <div class="subtitle"></div>
            <div class="author"></div>
            <div class="description"></div>
            <div class="category"></div>
        </div>
    </div>
</body>
<script src="./src/js/myBooks.js"></script>
</html>
